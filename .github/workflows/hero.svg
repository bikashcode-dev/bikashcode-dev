<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Bikash Sah, Java backend developer. Secure APIs, OTP and JWT auth, AI features with provider fallback. Open to work." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Bikash Sah - Java Backend Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f2027"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <clipPath id="card"><rect width="1000" height="300" rx="16"/></clipPath>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="140" cy="60" r="100" fill="#00d9ff" opacity="0.10" filter="url(#blur)">
      <animate attributeName="cy" values="60;120;60" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="260" r="120" fill="#1f6feb" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="860;790;860" dur="11s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#30363d"/>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="48" y="64" font-size="14" font-weight="700" letter-spacing="3" fill="#58a6ff">JAVA BACKEND DEVELOPER<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.0000;1" dur="0.6s" fill="freeze"/></text>

    <text x="48" y="136" font-size="64" font-weight="800" fill="url(#accent)">Bikash Sah<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.1818;1" dur="1.1s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 16;0 16;0 0" keyTimes="0;0.1818;1" dur="1.1s" fill="freeze"/></text>

    <rect x="48" y="150" width="220" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="0;0;220" keyTimes="0;0.4;1" dur="1.5s" fill="freeze"/>
    </rect>
    <rect x="48" y="150" width="50" height="4" rx="2" fill="url(#shine)">
      <animate attributeName="x" values="48;218;48" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>

    <g font-size="20" fill="#c9d1d9">
      <text x="48" y="190">Secure APIs, OTP + JWT auth, and AI features that<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4615;1" dur="1.3s" fill="freeze"/></text>
      <text x="48" y="217">keep working when a provider fails.<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5333;1" dur="1.5s" fill="freeze"/></text>
    </g>

    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6250;1" dur="1.6s" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="2.0s" repeatCount="indefinite"/>
        <rect x="48" y="238" width="84" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <text x="90.0" y="258" text-anchor="middle" font-size="14" fill="#c9d1d9">Java 17</text>
      </g>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6667;1" dur="1.8s" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
        <rect x="142" y="238" width="134" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <text x="209.0" y="258" text-anchor="middle" font-size="14" fill="#c9d1d9">Spring Boot 3</text>
      </g>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7000;1" dur="2s" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="3.0s" repeatCount="indefinite"/>
        <rect x="286" y="238" width="162" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <text x="367.0" y="258" text-anchor="middle" font-size="14" fill="#c9d1d9">MongoDB · MySQL</text>
      </g>
    </g>
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7273;1" dur="2.2s" fill="freeze"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" begin="3.5s" repeatCount="indefinite"/>
        <rect x="458" y="238" width="88" height="30" rx="15" fill="#161b22" stroke="#30363d"/>
        <text x="502.0" y="258" text-anchor="middle" font-size="14" fill="#c9d1d9">Docker</text>
      </g>
    </g>
  </g>

  <!-- JSON response card -->
  <g font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace">
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3846;1" dur="1.3s" fill="freeze"/>
      <rect x="588" y="48" width="364" height="212" rx="12" fill="#161b22" stroke="#30363d"/>
      <circle cx="608" cy="66" r="5" fill="#ff5f56"/>
      <circle cx="626" cy="66" r="5" fill="#ffbd2e"/>
      <circle cx="644" cy="66" r="5" fill="#27c93f"/>
      <text x="932" y="100" text-anchor="end" font-size="13" fill="#3fb950" font-weight="700">200 OK</text>
    </g>
    <text x="608" y="100" font-size="15"><tspan fill="#79c0ff">GET /developer/bikash</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6667;1" dur="1.5s" fill="freeze"/></text>
    <text x="608" y="124" font-size="15"><tspan fill="#8b949e">{</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7222;1" dur="1.8s" fill="freeze"/></text>
    <text x="630" y="148" font-size="15"><tspan fill="#79c0ff">"role"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Java Backend Developer"</tspan><tspan fill="#8b949e">,</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7500;1" dur="2s" fill="freeze"/></text>
    <text x="630" y="172" font-size="15"><tspan fill="#79c0ff">"auth"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"JWT + OTP"</tspan><tspan fill="#8b949e">,</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7727;1" dur="2.2s" fill="freeze"/></text>
    <text x="630" y="196" font-size="15"><tspan fill="#79c0ff">"data"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"MongoDB, MySQL"</tspan><tspan fill="#8b949e">,</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7917;1" dur="2.4s" fill="freeze"/></text>
    <text x="630" y="220" font-size="15"><tspan fill="#79c0ff">"status"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#3fb950" font-weight="700">"open to work"</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8077;1" dur="2.6s" fill="freeze"/></text>
    <text x="608" y="244" font-size="15"><tspan fill="#8b949e">}</tspan><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8214;1" dur="2.8s" fill="freeze"/></text>
    <circle cx="932" cy="215" r="4" fill="#3fb950"><animate attributeName="opacity" values="0;0;1" keyTimes="0;0.8;1" dur="2.6s" fill="freeze"/></circle>
    <circle cx="932" cy="215" r="4" fill="none" stroke="#3fb950" stroke-width="2">
      <animate attributeName="r" values="4;13" dur="1.8s" begin="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="1.8s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
